<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Livraria O2O - Cliente-Servidor (Ex. 8.5)</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #2c3e50; }
        .header { background: #2c3e50; color: white; padding: 15px 25px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .container { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); margin-bottom: 20px; }
        .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 15px; }
        .book-item { border: 1px solid #dcdde1; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; }
        .price { color: #27ae60; font-size: 18px; font-weight: bold; margin: 8px 0; }
        button { background: #2980b9; color: white; border: none; padding: 9px 14px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #bdc3c7; cursor: not-allowed; }
        .btn-danger { background: #e74c3c; padding: 3px 8px; font-size: 12px; }
        .btn-pix { background: #27ae60; width: 100%; padding: 12px; font-size: 15px; margin-top: 10px; }
        input { padding: 9px; border: 1px solid #ccc; border-radius: 5px; width: 100%; box-sizing: border-box; }
        #alertaFeedback { display: none; padding: 12px; border-radius: 6px; margin-bottom: 15px; font-weight: bold; }
        #boxReciboQr { display: none; background: #e8f8f5; border: 2px dashed #27ae60; padding: 12px; border-radius: 6px; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2 style="margin:0;">🌐 Livraria O2O — Arquitetura Cliente-Servidor (Ex. 8.5)</h2>
            <small>Frontend (View / Controller / Model) ⇄ HTTP REST JSON ⇄ Backend (Aplicação / Routes / Negócio / Dados)</small>
        </div>
        <div><strong>🛒 Carrinho: <span id="badgeContador">0</span></strong></div>
    </div>

    <div id="alertaFeedback"></div>

    <div class="container">
        <div>
            <div class="card">
                <form onsubmit="LivrariaClientController.acaoBuscar(event)" style="display:flex; gap:10px;">
                    <input type="text" id="inputBusca" placeholder="Pesquisar livro ou autor via API REST...">
                    <button type="submit">🔍 Buscar</button>
                </form>
            </div>

            <div class="card">
                <h3>📚 Catálogo (Carregado do Servidor)</h3>
                <div id="listaLivros" class="book-grid"></div>
            </div>
        </div>

        <div>
            <div class="card">
                <h3>📸 Scan & Go (Leitor ISBN)</h3>
                <form onsubmit="LivrariaClientController.acaoScanIsbn(event)" style="display:flex; gap:8px;">
                    <input type="text" id="inputIsbn" placeholder="Ex: 9780451524935" required>
                    <button type="submit">Scan</button>
                </form>
            </div>

            <div class="card">
                <h3>🛒 Carrinho Digital</h3>
                <div id="listaCarrinho"></div>
                <h4 style="text-align:right;">Subtotal: R$ <span id="valorSubtotal">0.00</span></h4>

                <form onsubmit="LivrariaClientController.acaoCheckoutPix(event)">
                    <input type="text" id="inputCliente" placeholder="Nome do Cliente (ex: Igor)" required style="margin-bottom:8px;">
                    <button type="submit" class="btn-pix">❖ Pagar com PIX</button>
                </form>

                <div id="boxReciboQr"></div>
            </div>
        </div>
    </div>

    <script src="model.js"></script>
    <script src="controller.js"></script>
</body>
</html>
